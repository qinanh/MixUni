# MixUni (main model): EGNN mixture encoder, a mixture-of-experts head shared by
# all properties, and a stretched-Arrhenius head for conductivity. Trained
# jointly on five CheMixHub properties with a random 70/20/10 split.
#
# Every option is listed here; the other configs start from this file
# (`base: ...`) and change only what differs.

properties: [IL_conductivity, IL_viscosity, PE_conductivity, NIST_viscosity, MiscSolv_density]

data:
  split: random              # random 70/20/10 (seed 42), or a JSON file of train/val/test indices
  batch_size: 64
  balanced_sampling: true    # draw every property equally often during training

model:
  hidden_dim: 64
  egnn_layers: 4             # message-passing layers per component graph
  mixture_layers: 3          # transformer layers over the components of a mixture
  mixture_heads: 4
  max_components: 8
  use_gil: false             # GeoMix graph interaction layers (used by the single-task baselines)
  gil_experts: 1
  denoise_sigma: 0.3         # coordinate noise (Å) for the denoising loss
  denoise_weight: 128.0
  shared_head: moe           # moe | per_property
  num_experts: 4
  top_k: 2
  property_dim: 16           # size of the learned property embedding
  physics_head: stretched_arrhenius   # stretched_arrhenius | arrhenius | vtf | free_mlp | none

train:
  seed: 42
  epochs: 200
  lr: 3.0e-4                 # AdamW
  weight_decay: 1.0e-12
  scheduler: cosine          # cosine (to 1e-5 over all epochs) | none
  grad_clip: 10.0
  loss_weighting: uncertainty  # uncertainty (Kendall et al.) | plain | gradnorm
  pcgrad: false
  aux_weight: 1.0            # weight of the auxiliary losses (denoising, MoE load balance)
  amp: false
